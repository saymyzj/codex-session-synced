name: Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      VERSION: "1.2.3"
      TAG: "v1.2.3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run isolated self-test
        run: dotnet run --project Windows/CodexSynced.Windows/CodexSynced.Windows.csproj -c Release -- --self-test

      - name: Publish Windows app directory
        run: >
          dotnet publish Windows/CodexSynced.Windows/CodexSynced.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/publish

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.1
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add WixToolset.UI.wixext/6.0.1 --global

      - name: Package release files
        shell: pwsh
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $publishDir = (Resolve-Path "artifacts/publish").Path
          wix build Windows/Installer/Package.wxs `
            -ext WixToolset.UI.wixext `
            -culture en-US `
            -d ProductVersion=$env:VERSION `
            -d PublishDir=$publishDir `
            -arch x64 `
            -o "artifacts/Codex-Synced-Windows-x64-$env:VERSION.msi"
          Compress-Archive -Path "artifacts/publish/*" -DestinationPath "artifacts/Codex-Synced-Windows-x64-$env:VERSION.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/saymyzj/codex-session-synced/releases/download/v1.0.1/Codex-Synced-1.0.1.dmg" `
            -OutFile "artifacts/Codex-Synced-macOS-1.0.1.dmg"
          $files = @(
            "artifacts/Codex-Synced-Windows-x64-$env:VERSION.msi",
            "artifacts/Codex-Synced-Windows-x64-$env:VERSION.zip",
            "artifacts/Codex-Synced-macOS-1.0.1.dmg"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          Set-Content -Path "artifacts/SHA256SUMS.txt" -Value $lines -Encoding ascii

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --target main --title "Codex Synced $env:VERSION" --notes-file "docs/release/v1.2.3.md"
          } else {
            gh release edit $env:TAG --title "Codex Synced $env:VERSION" --notes-file "docs/release/v1.2.3.md"
          }
          gh release upload $env:TAG `
            "artifacts/Codex-Synced-Windows-x64-$env:VERSION.msi" `
            "artifacts/Codex-Synced-Windows-x64-$env:VERSION.zip" `
            "artifacts/Codex-Synced-macOS-1.0.1.dmg" `
            "artifacts/SHA256SUMS.txt" `
            --clobber
