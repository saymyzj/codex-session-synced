name: Windows release

on:
  push:
    branches:
      - main
    paths:
      - "Windows/**"
      - ".github/workflows/windows-release.yml"
      - "docs/release/v1.1.0.md"
      - "docs/release/v1.1.0-en.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      VERSION: "1.1.0"
      TAG: "v1.1.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run isolated self-test
        run: dotnet run --project Windows/CodexSynced.Windows/CodexSynced.Windows.csproj -c Release -- --self-test

      - name: Publish single-file app
        run: >
          dotnet publish Windows/CodexSynced.Windows/CodexSynced.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/publish

      - name: Package release files
        shell: pwsh
        run: |
          Copy-Item "artifacts/publish/Codex Synced.exe" "artifacts/Codex-Synced-Windows-x64-$env:VERSION.exe"
          Compress-Archive -Path "artifacts/publish/*" -DestinationPath "artifacts/Codex-Synced-Windows-x64-$env:VERSION.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/saymyzj/codex-session-synced/releases/download/v1.0.1/Codex-Synced-1.0.1.dmg" `
            -OutFile "artifacts/Codex-Synced-macOS-1.0.1.dmg"
          $files = @(
            "artifacts/Codex-Synced-Windows-x64-$env:VERSION.exe",
            "artifacts/Codex-Synced-Windows-x64-$env:VERSION.zip",
            "artifacts/Codex-Synced-macOS-1.0.1.dmg"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          Set-Content -Path "artifacts/SHA256SUMS.txt" -Value $lines -Encoding ascii

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --target main --title "Codex Synced $env:VERSION" --notes-file "docs/release/v1.1.0.md"
          }
          gh release upload $env:TAG `
            "artifacts/Codex-Synced-Windows-x64-$env:VERSION.exe" `
            "artifacts/Codex-Synced-Windows-x64-$env:VERSION.zip" `
            "artifacts/Codex-Synced-macOS-1.0.1.dmg" `
            "artifacts/SHA256SUMS.txt" `
            --clobber
          gh release view "v1.1.0-windows" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete "v1.1.0-windows" --cleanup-tag --yes
          }
